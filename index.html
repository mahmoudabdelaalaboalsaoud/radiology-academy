<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أكاديمية الأشعة</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#050b14">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أكاديمية الأشعة">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{--bg:#050b14;--c:#22d3ee;--c2:#6366f1;--t:#e6f1ff;--m:#8aa0b8;--card:rgba(13,26,44,.82);--b:rgba(34,211,238,.2);--ok:#34d399;--w:#fbbf24;--bad:#f87171}
*{box-sizing:border-box;margin:0}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 80% 10%,rgba(99,102,241,.22),transparent 45%),radial-gradient(circle at 15% 85%,rgba(34,211,238,.18),transparent 45%),linear-gradient(rgba(34,211,238,.05) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,rgba(34,211,238,.05) 1px,transparent 1px) 0 0/40px 40px,var(--bg)}
.bg svg{position:absolute;left:50%;top:50%;width:min(520px,90vw);transform:translate(-50%,-50%);opacity:.13;stroke:var(--c);fill:none;stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--c))}
.bg .scan{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--c),transparent);box-shadow:0 0 22px var(--c);opacity:.5;animation:scan 6s linear infinite}
@keyframes scan{from{top:-3px}to{top:100%}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.bg .scan{animation:none}*{animation:none!important;transition:none!important}}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(5,11,20,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--b);flex-wrap:wrap}
header b{font-size:1.1rem;margin-inline-end:auto}
nav{display:flex;gap:6px;flex-wrap:wrap}
.nb{background:none;border:1px solid var(--b);color:var(--t);padding:7px 12px;border-radius:10px;cursor:pointer;font:inherit;font-size:.9rem}
.nb.on,.nb:hover{background:rgba(34,211,238,.15);border-color:var(--c)}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--b);border-radius:16px;padding:16px;backdrop-filter:blur(6px);animation:up .4s both}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:14px}
.cc{cursor:pointer;transition:.25s;overflow:hidden;padding:0}
.cc:hover{transform:translateY(-4px);border-color:var(--c);box-shadow:0 8px 28px rgba(34,211,238,.18)}
.cc .im{height:120px;background:linear-gradient(135deg,var(--c2),var(--c)) center/cover;display:flex;align-items:center;justify-content:center;font-size:2.4rem}
.cc .bd{padding:12px}
.m{color:var(--m);font-size:.88rem}
h2{margin:6px 0 10px}
input,select,textarea{width:100%;background:rgba(5,11,20,.7);border:1px solid var(--b);color:var(--t);padding:11px;border-radius:10px;font:inherit;margin:5px 0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--c)}
.btn{background:linear-gradient(135deg,var(--c2),var(--c));color:#04101c;font-weight:700;border:0;padding:11px 16px;border-radius:10px;cursor:pointer;font:inherit;font-weight:700;margin-top:6px}
.btn:hover{filter:brightness(1.1)}
.sm{padding:5px 9px;font-size:.8rem;margin:2px;border-radius:8px}
.gh{background:transparent;color:var(--t);border:1px solid var(--b)}
.auth{max-width:380px;margin:9vh auto 0;text-align:center}
.lnk{display:block;margin-top:12px;color:var(--c);cursor:pointer;font-size:.9rem}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;border:1px solid}
.active{color:var(--ok)}.expiring{color:var(--w)}.expired,.none{color:var(--bad)}
.ban{margin-bottom:12px;border-color:var(--w)}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--b);cursor:pointer}
.li:hover{background:rgba(34,211,238,.07)}
.vid{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.fc{min-height:170px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.25rem;padding:20px;white-space:pre-wrap}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:8px;text-align:right;border-bottom:1px solid var(--b);white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px}
.stats .card{text-align:center;padding:10px}.stats b{font-size:1.5rem;display:block}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:20;padding:14px}
#modal.show{display:flex}#modal .card{width:min(520px,100%)}
#toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,80px);background:#0d1a2c;border:1px solid var(--c);padding:10px 18px;border-radius:12px;transition:.3s;z-index:30}
#toast.show{transform:translate(-50%,0)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
a.btn{display:inline-block;text-decoration:none;text-align:center}
.wab{background:#25d366;color:#04101c;margin-top:12px;width:100%}
.plan{text-align:center}.plan .price{font-size:1.6rem;font-weight:700;color:var(--c);margin:6px 0}.plan.sel{border-color:var(--ok)}
.fab{position:fixed;bottom:18px;inset-inline-start:18px;width:56px;height:56px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:15}
.fab svg{width:30px;height:30px;fill:#fff}
.inst{display:none!important}body.canin .inst{display:inline-block!important}
body.prot{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.prot input,body.prot textarea{-webkit-user-select:text;user-select:text}
#wm{position:fixed;inset:0;z-index:25;pointer-events:none;background-repeat:repeat}
#blk{position:fixed;inset:0;background:#050b14;z-index:40;display:none;align-items:center;justify-content:center;font-size:3rem}
body.hid #blk{display:flex}
@media print{body.prot{display:none!important}}
</style>
</head>
<body>
<div class="bg"><svg viewBox="0 0 200 260"><path d="M100 20v220"/><path d="M100 60C70 55 40 70 30 110M100 60c30-5 60 10 70 50M100 90C65 88 38 105 30 150M100 90c35-2 62 15 70 60M100 120c-32 0-55 15-62 50M100 120c32 0 55 15 62 50"/><ellipse cx="100" cy="20" rx="18" ry="14"/></svg><div class="scan"></div></div>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<div id="blk">🔒</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== الإعدادات: ضع بيانات مشروعك من Supabase > Project Settings > API ===== */
const SUPABASE_URL='https://eqwwxbxavmbkelsuwxue.supabase.co';
const SUPABASE_KEY='sb_publishable_4ROXzU2swID-vbEDDd3G9A_9G2CyjPs';
let TEACHER='';
/* ============================================================================ */
const sb=SUPABASE_URL.startsWith('PUT_')?null:supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().replace(/[\u064B-\u065F\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').trim();
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let me=null,courses=[],lessons=[],students=[],cards=[],cur=null,plans=[],reqs=[],myReq=null,settings={site_name:'أكاديمية الأشعة',teacher_name:'',whatsapp:'',welcome_msg:''};
const A=$('#app');

function toast(m){const t=$('#toast');t.textContent=m;t.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',2800)}
function subDays(p){if(!p||!p.sub_until)return null;return Math.ceil((new Date(p.sub_until+'T23:59:59')-Date.now())/864e5)}
function subState(p){const d=subDays(p);if(d===null)return'none';if(d<0)return'expired';if(d<=5)return'expiring';return'active'}
const LBL={active:'نشط',expiring:'قارب على الانتهاء',expired:'منتهي',none:'غير مفعّل'};
const hasAccess=()=>me&&(me.role==='admin'||['active','expiring'].includes(subState(me)));
function waNum(p){let d=String(p||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d='20'+d.slice(1);return d}
function embed(u){try{const x=new URL(u);if(x.protocol!=='https:')return'';const h=x.hostname.replace('www.','');
 if(h==='youtube.com'&&x.searchParams.get('v'))return'https://www.youtube.com/embed/'+encodeURIComponent(x.searchParams.get('v'));
 if(h==='youtu.be')return'https://www.youtube.com/embed/'+encodeURIComponent(x.pathname.slice(1));
 return x.href}catch(e){return''}}

/* ---------- تثبيت التطبيق (PWA) ---------- */
let dip=null;
const stand=()=>(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;if(!stand())document.body.classList.add('canin')});
window.addEventListener('appinstalled',()=>{dip=null;document.body.classList.remove('canin');toast('تم تثبيت التطبيق ✅')});
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!stand())document.body.classList.add('canin');
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});

/* ---------- حماية المحتوى للأعضاء ---------- */
const isP=()=>document.body.classList.contains('prot'),isIn=t=>/^(INPUT|TEXTAREA)$/.test((t&&t.tagName)||'');
['copy','cut','contextmenu','dragstart'].forEach(ev=>document.addEventListener(ev,e=>{if(isP()&&!isIn(e.target))e.preventDefault()}));
document.addEventListener('selectstart',e=>{if(isP()&&!isIn(e.target))e.preventDefault()});
document.addEventListener('keydown',e=>{if(!isP())return;const k=(e.key||'').toLowerCase();
 if(k==='printscreen'){try{navigator.clipboard.writeText(' ')}catch(x){}toast('التصوير غير مسموح')}
 if((e.ctrlKey||e.metaKey)&&['c','x','s','p','u','a'].includes(k)&&!isIn(e.target))e.preventDefault()});
document.addEventListener('visibilitychange',()=>document.body.classList.toggle('hid',document.hidden&&isP()));
function setWM(){
 const o=$('#wm');if(o)o.remove();
 if(!me||me.role==='admin')return;
 const t=(me.full_name||'')+' • '+(me.phone||me.email||'');
 const x=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
 const svg='<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200"><text x="160" y="100" fill="#ffffff" fill-opacity="0.13" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" transform="rotate(-25 160 100)">'+x(t)+'</text></svg>';
 const w=document.createElement('div');w.id='wm';w.style.backgroundImage='url("data:image/svg+xml;utf8,'+encodeURIComponent(svg)+'")';document.body.appendChild(w);
}

/* ---------- المصادقة ---------- */
function authView(msg,mode){mode=mode||'in';const up=mode==='up';
 document.body.classList.remove('prot','hid');const w0=$('#wm');if(w0)w0.remove();
 A.innerHTML=`<div class="auth card"><h1 style="font-size:1.6rem">🩻 أكاديمية الأشعة</h1><p class="m" style="margin:6px 0 10px">${esc(msg||'سجّل دخولك للمتابعة')}</p>
 ${up?'<input id="fn" placeholder="الاسم الكامل"><input id="ph" placeholder="رقم الواتساب" inputmode="tel" dir="ltr">':''}
 <input id="em" type="email" placeholder="البريد الإلكتروني" dir="ltr"><input id="pw" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)" dir="ltr">
 <button class="btn" style="width:100%" data-act="${up?'signup':'signin'}">${up?'إنشاء حساب':'دخول'}</button>
 <button class="btn gh" style="width:100%;margin-top:8px" data-act="google">الدخول بحساب Google</button>
 <button class="btn gh inst" style="width:100%;margin-top:8px" data-act="install">📲 تثبيت التطبيق على الشاشة الرئيسية</button>
 <a class="lnk" data-act="sw" data-m="${up?'in':'up'}">${up?'لدي حساب بالفعل':'حساب جديد'}</a></div>`}

async function loadSettings(){
 const [s,p]=await Promise.all([sb.from('site_settings').select('*').eq('id',1).maybeSingle(),sb.from('plans').select('*').order('position')]);
 if(s.data)settings=Object.assign(settings,s.data);
 TEACHER=settings.teacher_name||'';plans=p.data||[];
 document.title=settings.site_name||document.title;
}
function phoneView(){
 A.innerHTML=`<div class="auth card"><h1 style="font-size:1.6rem">🩻 ${esc(settings.site_name)}</h1><p class="m" style="margin:8px 0 10px">أهلاً ${esc(me.full_name||'')} 👋<br>أدخل رقم الواتساب لإكمال التسجيل</p>
 <input id="ph" placeholder="رقم الواتساب" inputmode="tel" dir="ltr"><button class="btn" style="width:100%" data-act="savephone">حفظ ومتابعة</button><a class="lnk" data-act="out">خروج</a></div>`}
async function boot(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session)return authView();
 const {data,error}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
 if(error||!data){await sb.auth.signOut();return authView('تعذر تحميل الحساب، حاول مرة أخرى')}
 me=data;
 await loadSettings();
 document.body.classList.toggle('prot',me.role!=='admin');setWM();
 sb.from('profiles').update({last_seen:new Date().toISOString()}).eq('id',me.id).then(()=>{});
 if(me.role!=='admin'&&!String(me.phone||'').trim())return phoneView();
 shell();go(me.role==='admin'?'members':'home');
}
const WAI='<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>';
function waLink(t){const n=waNum(settings.whatsapp);return n?'https://wa.me/'+n+'?text='+encodeURIComponent(t):''}
function waMsg(){return 'مرحباً، أنا '+(me.full_name||'')+' ('+(me.email||'')+')'+(myReq?' واخترت '+myReq.plan_title+' بسعر '+Number(myReq.price).toLocaleString('en-US')+'. أرغب في تفعيل اشتراكي.':' وأرغب في الاشتراك في الأكاديمية.')}
function shell(){
 const adm=me.role==='admin',lk=(!adm&&!hasAccess())?waLink(waMsg()):'';
 A.innerHTML=`<header><b id="brand">🩻 ${esc(settings.site_name)}</b><nav>
 <button class="nb" data-act="go" data-v="home" id="n-home">الكورسات</button>
 <button class="nb" data-act="go" data-v="cards" id="n-cards">مراجعة ذكية</button>
 ${adm?'<button class="nb" data-act="go" data-v="content" id="n-content">المحتوى</button><button class="nb" data-act="go" data-v="members" id="n-members">الأعضاء</button><button class="nb" data-act="go" data-v="site" id="n-site">الموقع</button>':'<button class="nb" data-act="go" data-v="plans" id="n-plans">الاشتراك</button>'}
 <button class="nb inst" data-act="install">📲 تثبيت</button>
 <button class="nb" data-act="out">خروج</button></nav></header><main id="main"></main>${lk?`<a class="fab" href="${esc(lk)}" target="_blank" rel="noopener" aria-label="واتساب">${WAI}</a>`:''}`}
function go(v,id){
 document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('on',b.id==='n-'+v));
 ({home:home,cards:cardsView,plans:plansView,admin:membersView,members:membersView,content:contentView,site:siteView,course:()=>courseView(id),lesson:()=>lessonView(id)})[v]();
}

/* ---------- الطالب ---------- */
async function loadReq(){
 const r=await sb.from('sub_requests').select('*').eq('student_id',me.id).eq('status','pending').order('created_at',{ascending:false}).limit(1);
 myReq=(r.data||[])[0]||null;
}
function planHTML(){
 const L=plans.filter(p=>p.active);
 let h='<div class="card" style="margin-bottom:14px"><h2>باقات الاشتراك</h2>';
 if(!L.length)h+='<p class="m">لم تُضف باقات بعد، تواصل مع الإدارة.</p>';
 else h+='<p class="m">اختر الباقة المناسبة ثم تواصل معنا عبر واتساب لتفعيل اشتراكك.</p><div class="grid">'+L.map(p=>{const on=myReq&&myReq.plan_id===p.id;
  return`<div class="card plan${on?' sel':''}"><b>${esc(p.title)}</b><div class="price">${esc(Number(p.price).toLocaleString('en-US'))} ${esc(p.currency||'')}</div><p class="m">لمدة ${esc(p.months)} شهر</p>${p.description?`<p class="m">${esc(p.description)}</p>`:''}<button class="btn sm${on?' gh':''}" data-act="pick" data-id="${esc(p.id)}">${on?'✓ تم الاختيار':'اختيار الباقة'}</button></div>`}).join('')+'</div>';
 if(myReq)h+='<div class="card ban" style="margin-top:12px">تم تسجيل اختيارك: <b>'+esc(myReq.plan_title)+'</b>. تواصل معنا الآن عبر واتساب ليتم تفعيل اشتراكك.</div>';
 const lk=waLink(waMsg());
 if(lk)h+=`<a class="btn wab" href="${esc(lk)}" target="_blank" rel="noopener">💬 تواصل عبر واتساب لتفعيل الاشتراك</a>`;
 return h+'</div>';
}
async function plansView(){
 const m=$('#main');m.innerHTML='<p class="m">جاري التحميل...</p>';
 await loadReq();
 const st=subState(me);
 m.innerHTML=(st==='active'||st==='expiring'?`<div class="card" style="margin-bottom:14px">اشتراكك ${LBL[st]} حتى ${esc(me.sub_until)}</div>`:'')+planHTML();
}
async function home(){
 const m=$('#main');m.innerHTML='<p class="m">جاري التحميل...</p>';
 const [c,l]=await Promise.all([sb.from('courses').select('*').order('created_at'),sb.from('lessons').select('*').order('position')]);
 if(c.error||l.error)return m.innerHTML='<p class="m">تعذر تحميل البيانات، تأكد من تشغيل ملف schema.sql</p>';
 courses=c.data||[];lessons=l.data||[];
 const st=subState(me),d=subDays(me);
 let ban='',pb='';
 if(me.role!=='admin'){
  if(st==='none'||st==='expired'){
   if(st==='expired')ban='انتهى اشتراكك. اختر باقة للتجديد.';
   await loadReq();pb=planHTML();
  }else if(st==='expiring')ban='ينتهي اشتراكك خلال '+d+' يوم، جدّده من تبويب «الاشتراك».';
 }
 const wel=settings.welcome_msg?`<div class="card" style="margin-bottom:12px;white-space:pre-wrap">${esc(settings.welcome_msg)}</div>`:'';
 m.innerHTML=wel+(ban?`<div class="card ban">${esc(ban)}</div>`:'')+pb+'<input id="q" placeholder="🔍 بحث ذكي في الكورسات والدروس..."><div id="res"></div>';
 draw('');
}
function draw(q){
 const n=norm(q),r=$('#res');if(!r)return;

const BOX=[0,1,3,7,14],lk=()=>'lt_'+me.id;

function nextCard(){
 const s=lt(),now=Date.now(),due=cards.filter(c=>!s[c.id]||s[c.id].d<=now);

 if(!due.length)return m.innerHTML=`<div class="card">🎉 أنهيت مراجعة اليوم! ستظهر البطاقات التالية في موعدها المناسب.<p class="m">${cards.length} بطاقة في مجموعتك.</p></div>`;

function rate(ok){
 const s=lt(),b=ok?Math.min(((s[cur.id]||{b:0}).b)+1,BOX.length-1):0;

 nextCard();
}

function template(p){
 const st=subState(p),d=subDays(p),n=p.full_name||'عزيزي الطالب';
 const inactive=p.last_seen&&(Date.now()-new Date(p.last_seen))>14*864e5;
 if(st==='none')return`أهلاً ${n} 👋\nتم تسجيلك في أكاديمية الأشعة ولم يتم تفعيل اشتراكك بعد. للتفعيل برجاء التواصل معي.\n${TEACHER}`;
 if(st==='expiring')return`أهلاً ${n} 👋\nاشتراكك في أكاديمية الأشعة ينتهي خلال ${d} يوم (${p.sub_until}). يسعدني تجديده لتستمر في التعلم.\n${TEACHER}`;
 if(st==='expired')return`أهلاً ${n} 👋\nانتهى اشتراكك في أكاديمية الأشعة بتاريخ ${p.sub_until}. أتمنى عودتك، تواصل معي للتجديد.\n${TEACHER}`;
 if(inactive)return`أهلاً ${n} 👋\nلاحظت غيابك عن المنصة فترة. هل تحتاج مساعدة في المذاكرة؟ أنا موجود.\n${TEACHER}`;
 return`أهلاً ${n} 👋\nتم تفعيل اشتراكك حتى ${p.sub_until}. بالتوفيق في دراستك!\n${TEACHER}`;
}

const reqOf=id=>reqs.find(x=>x.student_id===id);
const planOf=r=>r&&plans.find(x=>x.id===r.plan_id);
function subDate(p,k){
 const t=new Date();t.setHours(0,0,0,0);
 let base=t;if(p.sub_until){const c=new Date(p.sub_until+'T00:00:00');if(c>t)base=c}
 const d=new Date(base);d.setDate(1);d.setMonth(d.getMonth()+Number(k));
 const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(base.getDate(),dim));
 return ymd(d)}

 async savephone(){const ph=val('ph').replace(/[^\d+]/g,'');if(ph.replace(/\D/g,'').length<8)return toast('اكتب رقم واتساب صحيح');
  const r=await sb.from('profiles').update({phone:ph}).eq('id',me.id);if(r.error)return toast('فشل الحفظ: '+r.error.message);
  me.phone=ph;shell();go('home')},
 async pick(e){const p=plans.find(x=>x.id===e.dataset.id);if(!p)return;
  await sb.from('sub_requests').delete().eq('student_id',me.id).eq('status','pending');
  const r=await sb.from('sub_requests').insert({student_id:me.id,plan_id:p.id,plan_title:p.title,months:p.months,price:p.price});
  if(r.error)return toast('خطأ: '+r.error.message);toast('تم اختيار الباقة ✅');go('plans')},
 approve(e){const p=students.find(x=>x.id===e.dataset.id),q=reqOf(e.dataset.id);if(!p||!q)return;
  const pl=planOf(q),k=pl?pl.months:q.months;
  if(!confirm('تفعيل '+k+' شهر للطالب '+(p.full_name||'')+'؟'))return;
  return setSub(p.id,subDate(p,k))},
 async delc(e){if(!confirm('حذف الكورس وكل دروسه؟'))return;const r=await sb.from('courses').delete().eq('id',e.dataset.id);if(r.error)return toast('فشل: '+r.error.message);toast('تم الحذف');adminView()},
 async dell(e){if(!confirm('حذف هذا الدرس؟'))return;const r=await sb.from('lessons').delete().eq('id',e.dataset.id);if(r.error)return toast('فشل: '+r.error.message);toast('تم الحذف');adminView()},
 async delf(e){if(!confirm('حذف هذه البطاقة؟'))return;const r=await sb.from('flashcards').delete().eq('id',e.dataset.id);if(r.error)return toast('فشل: '+r.error.message);toast('تم الحذف');adminView()},
 async togfree(e){const r=await sb.from('lessons').update({is_free:e.dataset.v!=='1'}).eq('id',e.dataset.id);if(r.error)return toast('فشل: '+r.error.message);adminView()},
 async savesite(){const row={id:1,site_name:val('s_name')||'أكاديمية الأشعة',teacher_name:val('s_teacher'),whatsapp:val('s_wa').replace(/\D/g,''),welcome_msg:val('s_wel')};
  const r=await sb.from('site_settings').upsert(row);if(r.error)return toast('فشل الحفظ: '+r.error.message);
  settings=row;TEACHER=row.teacher_name;document.title=row.site_name;const b=$('#brand');if(b)b.textContent='🩻 '+row.site_name;toast('تم الحفظ ✅')},
 async addplan(){if(!val('np_t'))return toast('اكتب اسم الباقة');
  const r=await sb.from('plans').insert({title:val('np_t'),months:Number(val('np_m'))||1,price:Number(val('np_p'))||0,currency:val('np_c')||'ج.م',description:val('np_d')||null,position:plans.length+1});
  if(r.error)return toast('خطأ: '+r.error.message);toast('تمت إضافة الباقة ✅');siteView()},
 async savep(e){const i=e.dataset.id;if(!val('pt_'+i))return toast('اكتب اسم الباقة');
  const r=await sb.from('plans').update({title:val('pt_'+i),months:Number(val('pm_'+i))||1,price:Number(val('pp_'+i))||0,currency:val('pc_'+i),description:val('pd_'+i)||null,active:$('#pa_'+i).checked}).eq('id',i);
  if(r.error)return toast('فشل: '+r.error.message);toast('تم الحفظ ✅')},
 async delp(e){if(!confirm('حذف هذه الباقة؟'))return;const r=await sb.from('plans').delete().eq('id',e.dataset.id);if(r.error)return toast('فشل: '+r.error.message);toast('تم الحذف');siteView()},
 async addf(){if(!val('fcid')||!val('ff')||!val('fb2'))return toast('أكمل البيانات');
  if(await ins('flashcards',{course_id:val('fcid'),front:val('ff'),back:val('fb2')},'تم حفظ البطاقة ✅')){adminView()}}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||!act[el.dataset.act])return;
 Promise.resolve(act[el.dataset.act](el)).catch(x=>toast('حدث خطأ: '+(x&&x.message||x)))});
document.addEventListener('input',e=>{if(e.target.id==='q')draw(e.target.value);if(e.target.id==='sq')drawStudents()});
document.addEventListener('change',e=>{if(e.target.id==='sf')drawStudents()});
if(SUPABASE_URL.startsWith('PUT_'))authView('عدّل SUPABASE_URL و SUPABASE_KEY داخل index.html');else boot();
</script>
</body>
