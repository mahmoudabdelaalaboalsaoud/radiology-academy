.qr{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;margin:6px 0;max-width:100%}
.qr>input,.qr>select{flex:1 1 0;min-width:0;width:auto;margin:0}
.qr>.btn{flex:none;width:auto;min-width:42px;margin:0;padding:9px 12px}
.qr>b,.qr>span{flex:none}
main{min-width:0}

<script>
/* ===== الإعدادات: ضع بيانات مشروعك من Supabase > Project Settings > API ===== */
const APP_VER=11;
const SUPABASE_URL='https://eqwwxbxavmbkelsuwxue.supabase.co';
const SUPABASE_KEY='sb_publishable_4ROXzU2swID-vbEDDd3G9A_9G2CyjPs';
let TEACHER='';
/* ============================================================================ */
const sb=SUPABASE_URL.startsWith('PUT_')?null:supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().replace(/[\u064B-\u065F\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').trim();
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let me=null,courses=[],lessons=[],students=[],cards=[],cur=null,plans=[],reqs=[],myReqs=[],chapters=[],myEnr=new Set(),myRes={},enr=[],selCh=new Set(),selInit=false,settings={site_name:'أكاديمية الأشعة',teacher_name:'',whatsapp:'',welcome_msg:''};
const A=$('#app');

function toast(m){const t=$('#toast');t.textContent=m;t.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',2800)}
function subDays(p){if(!p||!p.sub_until)return null;return Math.ceil((new Date(p.sub_until+'T23:59:59')-Date.now())/864e5)}
function subState(p){const d=subDays(p);if(d===null)return'none';if(d<0)return'expired';if(d<=5)return'expiring';return'active'}
const LBL={active:'نشط',expiring:'قارب على الانتهاء',expired:'منتهي',none:'غير مفعّل'};

function embed(u){try{const x=new URL(u);if(x.protocol!=='https:')return'';const h=x.hostname.replace('www.','');
 if(h==='youtube.com'&&x.searchParams.get('v'))return'https://www.youtube.com/embed/'+encodeURIComponent(x.searchParams.get('v'));
 if(h==='youtu.be')return'https://www.youtube.com/embed/'+encodeURIComponent(x.pathname.slice(1));
 return x.href}catch(e){return''}}

/* ---------- تثبيت التطبيق (PWA) ---------- */
let dip=null;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const stand=()=>(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
const POPK='ra_ipop';
function popSeen(){try{return Date.now()-Number(localStorage.getItem(POPK)||0)<3*864e5}catch(e){return false}}
function popHide(snooze){const p=$('#ipop');if(p)p.classList.remove('show');if(snooze){try{localStorage.setItem(POPK,String(Date.now()))}catch(e){}}}
function popHTML(){
 const logo='<div class="lg"><i></i><img src="/icon-192.png" alt=""></div>';
 const x='<button class="x" data-act="popclose" aria-label="إغلاق">✕</button>';
 if(isIOS)return`<div class="ic">${x}${logo}<h3>ثبّت التطبيق على جهازك</h3><p>ثلاث خطوات سريعة وتصبح الأكاديمية على شاشتك الرئيسية</p><ol class="st"><li><b>1</b><span>اضغط زر المشاركة <em>⬆️</em> أسفل المتصفح</span></li><li><b>2</b><span>اختر «إضافة إلى الشاشة الرئيسية»</span></li><li><b>3</b><span>اضغط «إضافة» في أعلى الشاشة</span></li></ol><button class="btn go" data-act="popclose">فهمت 👍</button></div>`;
 return`<div class="ic">${x}${logo}<h3>ثبّت أكاديمية الأشعة</h3><p>افتح منصتك بلمسة واحدة من الشاشة الرئيسية، بدون متصفح وبسرعة أكبر</p><div class="ft"><span>⚡ فتح فوري</span><span>📱 ملء الشاشة</span><span>🎓 دراستك معك دائماً</span></div><button class="btn go" data-act="doinst">📲 ثبّت التطبيق الآن</button><a class="lnk" data-act="popclose">ليس الآن</a></div>`}
function popShow(force){
 if(stand()||(!isIOS&&!dip))return;
 if(!force&&popSeen())return;
 const p=$('#ipop');if(!p)return;
 p.innerHTML=popHTML();
 requestAnimationFrame(()=>requestAnimationFrame(()=>p.classList.add('show')));
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;if(!stand()){document.body.classList.add('canin');setTimeout(()=>popShow(false),2500)}});

if(isIOS&&!stand()){document.body.classList.add('canin');setTimeout(()=>popShow(false),3500)}
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});

/* ---------- فحص التحديثات ---------- */
let lastChk=Date.now();

 if($('#upd'))return;
 const d=document.createElement('div');d.id='upd';
 d.innerHTML='🔄 يتوفر تحديث جديد للتطبيق <button class="btn sm" data-act="reload">تحديث الآن</button>';

}

 try{
  const r=await fetch('/index.html',{cache:'no-cache'}),t=await r.text(),m=t.match(/const APP_VER=(\d+)/);
  if(m&&Number(m[1])>APP_VER)showUpd();
 }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastChk>12e4){lastChk=Date.now();chkUpdate()}});

setTimeout(chkUpdate,4000);setInterval(chkUpdate,6e5);

const isP=()=>document.body.classList.contains('prot'),isIn=t=>/^(INPUT|TEXTAREA)$/.test((t&&t.tagName)||'');
['copy','cut','contextmenu','dragstart'].forEach(ev=>document.addEventListener(ev,e=>{if(isP()&&!isIn(e.target))e.preventDefault()}));

 if((e.ctrlKey||e.metaKey)&&['c','x','s','p','u','a'].includes(k)&&!isIn(e.target))e.preventDefault()});

function wmBg(t,op){
 const x=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

 return 'url("data:image/svg+xml;utf8,'+encodeURIComponent(svg)+'")';
}

 if(!me||me.role==='admin')return;

const money=p=>Number(p.price).toLocaleString('en-US')+' '+(p.currency||'');
async function loadReq(){
 const r=await sb.from('sub_requests').select('*').eq('student_id',me.id).eq('status','pending').order('created_at',{ascending:false});
 myReqs=r.data||[];
 if(!selInit){myReqs.forEach(x=>{if(x.chapter_id)selCh.add(x.chapter_id)});selInit=true}

async function loadAcc(){

const chPlan=id=>plans.find(p=>p.active&&p.chapter_id===id);

 if(locked.length)h+=`<div class="card" style="margin-bottom:12px"><p class="m">اختر الشابترات التي تريد الاشتراك فيها ثم اضغط «تواصل» في الأسفل.</p><button class="btn sm${allSel?' gh':''}" data-act="${allSel?'selnone':'selall'}" data-cid="${esc(id)}">${allSel?'إلغاء الاختيار':'☑ اختيار كل الشابترات'}</button></div>`;
 chs.forEach((ch,ci)=>{

/* ---------- اختبار الدرس ---------- */
let qz=null;
const shuf=a=>{const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r};
const shufNot=a=>{let r,n=0;do{r=shuf(a);n++}while(a.length>1&&n<6&&r.every((v,i)=>v===a[i]));return r};
const fillParts=p=>{const out=[],re=/\[\[(.+?)\]\]/g;let last=0,m;while((m=re.exec(p))){out.push({t:p.slice(last,m.index)});out.push({a:m[1].split('|').map(x=>x.trim()).filter(Boolean)});last=re.lastIndex}out.push({t:p.slice(last)});return out};
function qReset(){const z=qz,q=z.qs[z.i];z.sel=q&&q.type==='multi'?[]:null;z.ord=[];z.checked=false;z.ok=false;z.ans=null;z.fok=[]}
async function loadAudio(lid){
 if(!$('#au'))return;
 const r=await sb.from('lesson_audio').select('*').eq('lesson_id',lid).order('position');
 const L=r.data||[];if(!L.length)return;
 const u=await sb.storage.from('lesson-audio').createSignedUrls(L.map(x=>x.path),3600);
 const mp={};(u.data||[]).forEach(x=>{if(x.signedUrl)mp[x.path]=x.signedUrl});
 const h=$('#au');if(!h)return;
 h.innerHTML='<div class="card"><h2>🎧 الشرح الصوتي</h2>'+L.map(x=>mp[x.path]?`<div style="margin:10px 0"><b>${esc(x.title||'تسجيل صوتي')}</b><audio controls controlsList="nodownload" preload="none" src="${esc(mp[x.path])}"></audio></div>`:'').join('')+'</div>';
}
async function loadQuiz(lid){
 const r=await sb.from('lesson_questions').select('*').eq('lesson_id',lid).order('position');
 const qs=r.data||[];if(!qs.length||!$('#qz'))return;
 qz={lid,qs,i:0,score:0,done:false,intro:true,sh:{}};qReset();qRender();
}
function qBody(q,d,z){
 const lock=z.checked,P=`<p style="font-size:1.05rem;white-space:pre-wrap;margin:8px 0">${esc(q.prompt)}</p>`;
 if(q.type==='mcq'||q.type==='multi'){const mc=q.type==='multi',sel=z.sel,cor=mc?d.correct:[d.correct];
  return P+d.options.map((o,i)=>{const on=mc?sel.includes(i):sel===i;let c=on?' on':'';if(lock){if(cor.includes(i))c=' ok';else if(on)c=' bad'}return`<button class="qo${c}" data-act="qsel" data-i="${i}" ${lock?'disabled':''}>${esc(o)}</button>`}).join('')}
 if(q.type==='tf')return P+[[true,'✅ صح'],[false,'❌ خطأ']].map(([v,t])=>{let c=z.sel===v?' on':'';if(lock){if(d.correct===v)c=' ok';else if(z.sel===v)c=' bad'}return`<button class="qo${c}" data-act="qtfs" data-v="${v?1:0}" ${lock?'disabled':''}>${t}</button>`}).join('');
 if(q.type==='fill'){const bank=d.mode==='bank';let n=0;
  const opts=bank?(z.sh[q.id]||(z.sh[q.id]=shuf([...new Set(fillParts(q.prompt).filter(x=>x.a).map(x=>x.a[0]).concat(d.distractors||[]))]))):null;
  return'<p style="font-size:1.05rem;line-height:2.5;margin:8px 0">'+fillParts(q.prompt).map(x=>{if(x.t!==undefined)return esc(x.t);const k=n++,v=z.ans?z.ans[k]||'':'',cls='fi'+(lock?(z.fok[k]?' okf':' badf'):'');

async function recStart(){
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const types=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
  const mt=(window.MediaRecorder&&types.find(t=>MediaRecorder.isTypeSupported(t)))||'';
  const mr=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream);
  rec={mr,stream,chunks:[],t0:Date.now(),st:'rec',blob:null,url:null};
  const me2=rec;
  mr.ondataavailable=e=>{if(e.data&&e.data.size)me2.chunks.push(e.data)};
  mr.onstop=()=>{me2.stream.getTracks().forEach(t=>t.stop());clearInterval(me2.tm);me2.blob=new Blob(me2.chunks,{type:mr.mimeType||mt||'audio/webm'});me2.url=URL.createObjectURL(me2.blob);me2.st='done';recRender()};
  mr.start(1000);
  me2.tm=setInterval(()=>{const s=Math.floor((Date.now()-me2.t0)/1000),el=$('#rt');if(el)el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},500);
  recRender();
 }catch(err){toast('تعذر تشغيل الميكروفون، اسمح للموقع باستخدامه من إعدادات المتصفح')}
}

async function sendMsg(ch){
 const t=$('#mt').value.trim();if(!t)return toast('اكتب نص الرسالة');
 const p=cur;
 if(ch==='wa'){const n=waNum(p.phone);if(!n)return toast('لا يوجد رقم هاتف');window.open('https://wa.me/'+n+'?text='+encodeURIComponent(t),'_blank','noopener')}
 else{if(!p.email)return toast('لا يوجد بريد');window.open('https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(p.email)+'&su='+encodeURIComponent('أكاديمية الأشعة')+'&body='+encodeURIComponent(t),'_blank','noopener')}

 $('#modal').className='';
}
async function ins(table,row,msg){

   const r=await sb.from('enrollments').upsert({student_id:p.id,chapter_id:cid});if(r.error)return toast('فشل: '+r.error.message);
   await sb.from('sub_requests').update({status:'done'}).eq('id',q.id);toast('تم فتح الشابتر ✅');return membersView()}
  const k=pl?pl.months:q.months;if(!confirm('تفعيل اشتراك شامل '+k+' شهر للطالب '+(p.full_name||'')+'؟'))return;
  const r2=await sb.from('profiles').update({sub_until:subDate(p,k)}).eq('id',p.id);if(r2.error)return toast('فشل: '+r2.error.message);
  await sb.from('sub_requests').update({status:'done'}).eq('id',q.id);toast('تم التفعيل ✅');membersView()},
 mopen(e){ms.s='detail';ms.id=e.dataset.id;ms.edit=false;membersView()},
 mback(){ms.s='list';ms.id=null;membersView()},
 mfilter(e){ms.f=e.dataset.f;ms.lim=40;drawStudents()},
 mmore(){ms.lim+=40;drawStudents()},
 medit(){ms.edit=!ms.edit;memberDetail($('#main'))},
 async msave(e){const n=val('en'),ph=val('ep').replace(/[^\d+]/g,'');if(!n)return toast('اكتب الاسم');
  const r=await sb.from('profiles').update({full_name:n,phone:ph}).eq('id',e.dataset.id);if(r.error)return toast('فشل: '+r.error.message);toast('تم الحفظ ✅');ms.edit=false;membersView()},
 async approveall(e){const sid=e.dataset.sid,p=students.find(x=>x.id===sid);if(!p)return;
  const rows=reqsOf(sid).map(q=>{const pl=planOf(q);return{q,cid:pl?pl.chapter_id:q.chapter_id}}).filter(x=>x.cid);
  if(!rows.length)return toast('لا توجد طلبات شابترات، افتح الملف للتفعيل');
  if(!confirm('فتح '+rows.length+' شابتر للطالب '+(p.full_name||'')+'؟'))return;
  const r=await sb.from('enrollments').upsert(rows.map(x=>({student_id:sid,chapter_id:x.cid})));if(r.error)return toast('فشل: '+r.error.message);
  await sb.from('sub_requests').update({status:'done'}).in('id',rows.map(x=>x.q.id));toast('تم التفعيل ✅');membersView()},
 async rejreq(e){if(!confirm('رفض هذا الطلب؟'))return;await sb.from('sub_requests').delete().eq('id',e.dataset.rid);toast('تم الرفض');membersView()},
 async rejall(e){if(!confirm('رفض كل طلبات هذا الطالب؟'))return;await sb.from('sub_requests').delete().eq('student_id',e.dataset.sid).eq('status','pending');toast('تم الرفض');membersView()},
 mcsv(){const q=v=>{let t=String(v==null?'':v);if(/^[=+\-@]/.test(t))t="'"+t;return'"'+t.replace(/"/g,'""')+'"'};
  const rows=[['الاسم','الهاتف','البريد','تاريخ التسجيل','آخر ظهور','الاشتراك الشامل','ينتهي في','الشابترات المفتوحة']].concat(students.map(p=>[p.full_name,p.phone,p.email,(p.created_at||'').slice(0,10),(p.last_seen||'').slice(0,10),LBL[subState(p)],p.sub_until||'',enrOf(p.id).map(x=>chName(x.chapter_id)).join(' | ')]));
  try{const b=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='members.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('تم تجهيز الملف')}catch(x){toast('تعذر التصدير')}},
 async grant(e){const cid=val('gs_'+e.dataset.id);if(!cid)return toast('اختر الشابتر');const r=await sb.from('enrollments').upsert({student_id:e.dataset.id,chapter_id:cid});if(r.error)return toast('فشل: '+r.error.message);toast('تم فتح الشابتر ✅');membersView()},
 async revch(e){if(!confirm('سحب هذا الشابتر من الطالب؟'))return;const r=await sb.from('enrollments').delete().eq('student_id',e.dataset.sid).eq('chapter_id',e.dataset.cid);if(r.error)return toast('فشل: '+r.error.message);toast('تم السحب');membersView()},
 async delch(e){if(!confirm('حذف الشابتر وباقته؟ (دروسه تبقى بدون شابتر)'))return;const r=await sb.from('chapters').delete().eq('id',e.dataset.id);if(r.error)return toast('فشل: '+r.error.message);toast('تم الحذف');adminView()},
 async delc(e){if(!confirm('حذف الكورس وكل دروسه؟'))return;const r=await sb.from('courses').delete().eq('id',e.dataset.id);if(r.error)return toast('فشل: '+r.error.message);toast('تم الحذف');adminView()},
 async dell(e){if(!confirm('حذف هذا الدرس؟'))return;const r=await sb.from('lessons').delete().eq('id',e.dataset.id);if(r.error)return toast('فشل: '+r.error.message);toast('تم الحذف');adminView()},
 async delf(e){if(!confirm('حذف هذه البطاقة؟'))return;const r=await sb.from('flashcards').delete().eq('id',e.dataset.id);if(r.error)return toast('فشل: '+r.error.message);toast('تم الحذف');adminView()},
 async togfree(e){const r=await sb.from('lessons').update({is_free:e.dataset.v!=='1'}).eq('id',e.dataset.id);if(r.error)return toast('فشل: '+r.error.message);adminView()},
 async savesite(){const row={id:1,site_name:val('s_name')||'أكاديمية الأشعة',teacher_name:val('s_teacher'),whatsapp:val('s_wa').replace(/\D/g,''),welcome_msg:val('s_wel')};
  const r=await sb.from('site_settings').upsert(row);if(r.error)return toast('فشل الحفظ: '+r.error.message);
  settings=row;TEACHER=row.teacher_name;document.title=row.site_name;const b=$('#brand');if(b)b.textContent='🩻 '+row.site_name;toast('تم الحفظ ✅')},
 async addplan(){if(!val('np_t'))return toast('اكتب اسم الباقة');
  const r=await sb.from('plans').insert({title:val('np_t'),chapter_id:val('np_ch')||null,months:Number(val('np_m'))||1,price:Number(val('np_p'))||0,currency:val('np_c')||'ج.م',description:val('np_d')||null,position:plans.length+1});
  if(r.error)return toast('خطأ: '+r.error.message);toast('تمت إضافة الباقة ✅');siteView()},
 async savep(e){const i=e.dataset.id;if(!val('pt_'+i))return toast('اكتب اسم الباقة');
  const r=await sb.from('plans').update({chapter_id:val('pch_'+i)||null,title:val('pt_'+i),months:Number(val('pm_'+i))||1,price:Number(val('pp_'+i))||0,currency:val('pc_'+i),description:val('pd_'+i)||null,active:$('#pa_'+i).checked}).eq('id',i);
  if(r.error)return toast('فشل: '+r.error.message);toast('تم الحفظ ✅')},
 async delp(e){if(!confirm('حذف هذه الباقة؟'))return;const r=await sb.from('plans').delete().eq('id',e.dataset.id);if(r.error)return toast('فشل: '+r.error.message);toast('تم الحذف');siteView()},
 async addf(){if(!val('fcid')||!val('ff')||!val('fb2'))return toast('أكمل البيانات');
  const ch=chapters.find(x=>x.id===val('fch'));
  if(await ins('flashcards',{course_id:ch?ch.course_id:val('fcid'),chapter_id:ch?ch.id:null,front:val('ff'),back:val('fb2')},'تم حفظ البطاقة ✅')){adminView()}}

};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||!act[el.dataset.act])return;
 Promise.resolve(act[el.dataset.act](el)).catch(x=>toast('حدث خطأ: '+(x&&x.message||x)))});
document.addEventListener('input',e=>{if(e.target.id==='q')draw(e.target.value);if(e.target.id==='sq')drawStudents();if((e.target.id||'').startsWith('w_'))wmPrev()});
document.addEventListener('change',e=>{if(e.target.id==='sf')drawStudents();if(e.target.id==='lc'&&$('#lch'))$('#lch').innerHTML=chOptsFor(e.target.value,'')});
if(SUPABASE_URL.startsWith('PUT_'))authView('عدّل SUPABASE_URL و SUPABASE_KEY داخل index.html');else boot();
